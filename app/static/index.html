<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Costo de recetas</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #616e7c;
      --border: #e4e7eb;
      --accent: #2f6fde;
      --warning-bg: #fff6e0;
      --warning-text: #8a5a00;
      --error-bg: #fdecec;
      --error-text: #a12626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.6rem; margin: 0 0 16px; }
    h2 { font-size: 1.15rem; margin: 0 0 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }
    form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; color: var(--muted); }
    select, input, button { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); }
    select { min-width: 280px; max-width: 100%; }
    button { background: var(--accent); color: white; border: none; cursor: pointer; padding: 9px 18px; }
    button:disabled { opacity: 0.6; cursor: default; }
    .totals { display: flex; flex-wrap: wrap; gap: 24px; }
    .total-value { font-size: 1.6rem; font-weight: 600; }
    .total-label, .muted { color: var(--muted); font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
    th { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
    td.number, th.number { text-align: right; white-space: nowrap; }
    .message { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
    .warning { background: var(--warning-bg); color: var(--warning-text); }
    .error { background: var(--error-bg); color: var(--error-text); }
    ul.similar { list-style: none; padding: 0; margin: 0; }
    ul.similar li { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; }
    ul.similar a { color: var(--accent); cursor: pointer; text-decoration: none; }
    ul.similar a:hover { text-decoration: underline; }
    .table-wrapper { overflow-x: auto; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Costo de recetas</h1>

  <section class="card">
    <form id="form">
      <label>Plato
        <select id="recipe" required></select>
      </label>
      <label>Fecha de cotización
        <input id="date" type="date" required>
      </label>
      <button id="submit" type="submit">Ver</button>
    </form>
  </section>

  <div id="error" class="message error" hidden></div>

  <div id="result" hidden>
    <div id="warnings"></div>

    <section class="card">
      <h2 id="recipe-name"></h2>
      <div class="totals">
        <div><div class="total-value" id="total-ars"></div><div class="total-label">Pesos argentinos</div></div>
        <div><div class="total-value" id="total-usd"></div><div class="total-label">Dólares estadounidenses</div></div>
      </div>
      <p class="muted" id="rate"></p>
    </section>

    <section class="card">
      <h2>Ingredientes</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Ingrediente</th>
              <th class="number">Cantidad</th>
              <th class="number">Se compra</th>
              <th class="number">Costo</th>
            </tr>
          </thead>
          <tbody id="ingredients"></tbody>
        </table>
      </div>
      <p class="muted">Las verduras, carnes y pescados se venden de a múltiplos de 250 g.</p>
    </section>

    <section class="card">
      <h2>Preparación</h2>
      <p id="instructions"></p>
    </section>

    <section class="card">
      <h2>Platos con ingredientes en común</h2>
      <ul class="similar" id="similar"></ul>
    </section>
  </div>
</main>

<script>
  const ars = new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS" });
  const usd = new Intl.NumberFormat("es-AR", { style: "currency", currency: "USD" });
  const rateFormat = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 2 });

  const $ = (id) => document.getElementById(id);

  // Fecha local en formato YYYY-MM-DD (toISOString usa UTC y puede dar el día siguiente).
  function isoDate(d) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  // "2026-10-04" -> "04/10/2026", igual que muestra el calendario.
  function formatDate(iso) {
    const [year, month, day] = iso.split("-");
    return `${day}/${month}/${year}`;
  }

  function formatGrams(grams) {
    if (grams === null) return "a gusto";
    if (grams < 1000) return `${grams} g`;
    // Coma decimal como en los montos: 1250 g -> "1,25 kg".
    return `${String(grams / 1000).replace(".", ",")} kg`;
  }

  // Los montos llegan como string ("7925.00") para no perder precisión; acá solo se formatean.
  function formatMoney(value, formatter) {
    return value === null ? "—" : formatter.format(Number(value));
  }

  // FastAPI devuelve `detail` como texto (errores nuestros) o como lista (validación de parámetros).
  function errorMessage(body, status) {
    if (typeof body?.detail === "string") return body.detail;
    if (Array.isArray(body?.detail)) return body.detail.map((e) => e.msg).join(". ");
    return `Error inesperado (HTTP ${status})`;
  }

  async function getJson(url) {
    const response = await fetch(url);
    const body = await response.json().catch(() => null);
    if (!response.ok) throw new Error(errorMessage(body, response.status));
    return body;
  }

  function showError(message) {
    $("error").textContent = message;
    $("error").hidden = false;
    $("result").hidden = true;
  }

  // Se usa textContent (no innerHTML) para que ningún dato se interprete como HTML.
  function cell(text, className) {
    const td = document.createElement("td");
    td.textContent = text;
    if (className) td.className = className;
    return td;
  }

  function renderDetail(detail) {
    $("recipe-name").textContent = detail.name;
    $("total-ars").textContent = formatMoney(detail.cost.ars, ars);
    $("total-usd").textContent = formatMoney(detail.cost.usd, usd);
    $("rate").textContent = detail.cost.ars_per_usd === null
      ? `Sin cotización del dólar para el ${formatDate(detail.cost.date)}`
      : `Cotización del ${formatDate(detail.cost.date)}: 1 USD = ${rateFormat.format(Number(detail.cost.ars_per_usd))} ARS`;
    $("instructions").textContent = detail.instructions;

    $("ingredients").replaceChildren(...detail.ingredients.map((line) => {
      const tr = document.createElement("tr");
      tr.append(
        cell(line.name),
        cell(formatGrams(line.quantity_grams), "number"),
        cell(line.purchased_grams === null ? "—" : formatGrams(line.purchased_grams), "number"),
        cell(formatMoney(line.cost_ars, ars), "number"),
      );
      return tr;
    }));

    $("warnings").replaceChildren(...detail.warnings.map((text) => {
      const div = document.createElement("div");
      div.className = "message warning";
      div.textContent = text;
      return div;
    }));
  }

  function renderSimilar(similar) {
    if (similar.length === 0) {
      const li = document.createElement("li");
      li.className = "muted";
      li.textContent = "No hay otros platos con ingredientes en común.";
      $("similar").replaceChildren(li);
      return;
    }
    $("similar").replaceChildren(...similar.map((recipe) => {
      const li = document.createElement("li");
      const link = document.createElement("a");
      link.textContent = recipe.name;
      link.addEventListener("click", () => {
        $("recipe").value = String(recipe.id);
        load();
      });
      const count = document.createElement("span");
      count.className = "muted";
      count.textContent = `${recipe.shared_ingredients} en común`;
      li.append(link, count);
      return li;
    }));
  }

  async function load() {
    const recipeId = $("recipe").value;
    const date = $("date").value;
    $("submit").disabled = true;
    $("error").hidden = true;
    try {
      const [detail, similar] = await Promise.all([
        getJson(`/recipes/${recipeId}?date=${encodeURIComponent(date)}`),
        getJson(`/recipes/${recipeId}/similar`),
      ]);
      renderDetail(detail);
      renderSimilar(similar);
      $("result").hidden = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (error) {
      showError(error.message);
    } finally {
      $("submit").disabled = false;
    }
  }

  async function init() {
    $("date").value = isoDate(new Date());

    try {
      const recipes = await getJson("/recipes");
      $("recipe").replaceChildren(...recipes.map((recipe) => new Option(recipe.name, recipe.id)));
    } catch (error) {
      showError(`No se pudo cargar el listado de platos: ${error.message}`);
    }
  }

  $("form").addEventListener("submit", (event) => {
    event.preventDefault();
    load();
  });

  init();
</script>
</body>
</html>
